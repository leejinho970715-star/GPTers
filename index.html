<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="지피터스 AI 커뮤니티 인트로 영상">
  <meta property="og:title" content="지피터스 리뉴얼 사이트">
  <meta property="og:description" content="분야별로 원하는 AI 실무 적용 사례 정보를 빠르게 찾아보세요.">
  <meta property="og:type" content="website">
  <title>GPTers_리뉴얼</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-24x24.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-57x57.png">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-60x60.png">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-72x72.png">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-76x76.png">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-96x96.png">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-114x114.png">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="page-intro">

  <div class="intro-screen">
    <video id="intro-video" autoplay muted playsinline preload="auto" class="intro-video" aria-label="지피터스 인트로 영상">
      <source src="assets/robot_GPTers_video.mp4" type="video/mp4">
    </video>

    <div id="intro-stage-2" class="banner-section intro-stage-2 hidden">
      <video id="intro-video-2" muted playsinline preload="auto" class="hero-video" aria-label="최신 AI 소식의 허브 영상">
        <source src="assets/main_visual_video.8e52b77f.mp4" type="video/mp4">
      </video>
      <div class="banner-overlay"></div>
      <div class="banner-content">
        <p class="intro-line">최신 AI 소식의 허브</p>
        <p class="intro-line">국내 최대 AI 커뮤니티 지피터스에서</p>
        <p class="highlight intro-line">다양한 AI 실무 활용 사례를 만나보세요.</p>
      </div>
    </div>

    <button type="button" id="intro-skip-btn" class="btn-pill btn-pill--outline intro-skip-btn">
      건너뛰기
      <span class="btn-pill-icon">
        <svg class="lucide lucide-arrow-right" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M5 12h14" />
          <path d="m12 5 7 7-7 7" />
        </svg>
      </span>
    </button>
  </div>

  <script>
    (function () {
      var video1 = document.getElementById('intro-video');
      var stage2 = document.getElementById('intro-stage-2');
      var video2 = document.getElementById('intro-video-2');
      var skipBtn = document.getElementById('intro-skip-btn');
      var hasNavigated = false;

      function goToMain() {
        if (hasNavigated) return;
        hasNavigated = true;
        window.location.href = 'home.html';
      }

      function playStage2() {
        video1.classList.add('hidden');
        stage2.classList.remove('hidden');
        video2.play();
      }

      video1.addEventListener('ended', playStage2);
      video2.addEventListener('ended', goToMain);
      skipBtn.addEventListener('click', goToMain);
    })();
  </script>
</body>

</html>
